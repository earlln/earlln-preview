<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fd6">
  <meta name="description" content="맥켄지 신전·플랭크·버드 독 코어 운동을 매일 아침 음성과 타이머로 도와주는 운동 도우미">
  <title>EarllnCore</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 홈 -->
    <section id="view-home" class="view active">
      <header class="top">
        <div>
          <p class="muted" id="today-label"></p>
          <h1 data-i18n="app_title">EarllnCore</h1>
          <p class="tagline" data-i18n="tagline">아침 코어 운동</p>
        </div>
        <div class="streak" id="streak-badge" data-i18n-title="streak_title"></div>
      </header>

      <div class="card today-card" id="today-card"></div>

      <h2 class="section-title" data-i18n="today_order">오늘의 순서</h2>
      <ol class="ex-list" id="ex-list"></ol>

      <button class="btn primary big" id="start-btn"></button>
      <p class="muted small center" id="start-note"></p>
      <p class="version center" data-version></p>
    </section>

    <!-- 기록 -->
    <section id="view-log" class="view">
      <header class="top"><h1 data-i18n="log_title">운동 기록</h1></header>
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="cal-head">
          <button class="icon-btn" id="cal-prev" data-i18n-aria="prev_month">‹</button>
          <strong id="cal-title"></strong>
          <button class="icon-btn" id="cal-next" data-i18n-aria="next_month">›</button>
        </div>
        <div class="cal-grid cal-week" id="cal-week"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="legend">
          <span><i class="dot done"></i><b data-i18n="legend_done">완료</b></span>
          <span><i class="dot partial"></i><b data-i18n="legend_partial">일부</b></span>
        </div>
      </div>
      <p class="muted small center" data-i18n="log_hint"></p>
    </section>

    <!-- 설정 -->
    <section id="view-settings" class="view">
      <header class="top"><h1 data-i18n="settings_title">설정</h1></header>
      <h2 class="section-title" data-i18n="sec_language">언어 · Language</h2>
      <div class="card">
        <div class="row"><span data-i18n="lang_label">화면과 음성 언어</span>
          <select id="opt-lang"><option value="ko">한국어</option><option value="en">English</option></select>
        </div>
      </div>

      <h2 class="section-title" id="reminder-title" data-i18n="sec_reminder" hidden>아침 알림</h2>
      <div class="card" id="reminder-card" hidden>
        <label class="row"><span data-i18n="reminder_on">매일 알림 받기</span><input type="checkbox" id="opt-reminder" class="switch"></label>
        <div class="row" id="reminder-time-row"><span data-i18n="reminder_time">알림 시간</span><input type="time" id="opt-reminder-time"></div>
        <p class="small muted" data-i18n="reminder_note"></p>
      </div>

      <h2 class="section-title" data-i18n="sec_features">기능</h2>
      <div class="card" id="settings-features"></div>

      <h2 class="section-title" data-i18n="sec_exercises">운동</h2>
      <div id="settings-ex"></div>

      <h2 class="section-title" id="prep-title" data-i18n="sec_timer">타이머</h2>
      <div class="card" id="prep-card">
        <div class="row"><span data-i18n="prep_time">운동 사이 준비 시간</span><div class="stepper" data-global="prep"></div></div>
      </div>

      <h2 class="section-title" id="music-title" data-i18n="sec_music">배경음악</h2>
      <div class="card" id="music-card">
        <div class="row"><span data-i18n="music_style">음악 종류</span>
          <select id="opt-music-style"><option value="pad" data-i18n="music_pad"></option><option value="musicbox" data-i18n="music_box"></option><option value="waves" data-i18n="music_waves"></option></select>
        </div>
        <div class="row"><span data-i18n="music_vol">음량</span>
          <div class="vol"><input type="range" id="opt-music-vol" min="5" max="100" step="5"><output id="music-vol-text"></output></div>
        </div>
        <button class="btn ghost" id="music-preview"></button>
        <p class="small muted" data-i18n="music_note"></p>
      </div>

      <h2 class="section-title" id="sound-title" data-i18n="sec_sound">음성/소리</h2>
      <div class="card" id="sound-card">
        <label class="row"><span data-i18n="opt_voice">음성 안내</span><input type="checkbox" id="opt-voice" class="switch"></label>
        <label class="row"><span data-i18n="opt_count">마지막 3초 세기 (음성)</span><input type="checkbox" id="opt-count" class="switch"></label>
        <label class="row"><span data-i18n="opt_beep">효과음 (삐 소리)</span><input type="checkbox" id="opt-beep" class="switch"></label>
        <div class="row"><span data-i18n="voice_rate">음성 속도</span>
          <select id="opt-rate"><option value="0.8" data-i18n="rate_slow"></option><option value="1" data-i18n="rate_normal"></option><option value="1.2" data-i18n="rate_fast"></option></select>
        </div>
        <button class="btn ghost" id="test-voice" data-i18n="test_voice"></button>
      </div>

      <h2 class="section-title" data-i18n="sec_data">데이터</h2>
      <div class="card">
        <p class="small muted" data-i18n="data_note"></p>
        <div class="btn-row">
          <button class="btn ghost" id="export-btn" data-i18n="export"></button>
          <button class="btn ghost" id="import-btn" data-i18n="import"></button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
        <button class="btn ghost danger" id="reset-settings" data-i18n="reset_settings"></button>
      </div>
      <p class="muted small center" data-i18n-html="footer_caution"></p>
      <p class="version center" data-version></p>
    </section>

    <nav class="tabbar">
      <button data-view="home" class="active"><span>🏠</span><b data-i18n="tab_home">홈</b></button>
      <button data-view="log"><span>📅</span><b data-i18n="tab_log">기록</b></button>
      <button data-view="settings"><span>⚙️</span><b data-i18n="tab_settings">설정</b></button>
    </nav>
  </main>

  <!-- 운동 진행 화면 -->
  <section id="workout" class="workout" hidden>
    <div class="wo-top">
      <button class="icon-btn" id="wo-close" data-i18n-aria="wo_close">✕</button>
      <div class="wo-progress"><div id="wo-progress-bar"></div></div>
      <span class="small" id="wo-progress-text"></span>
    </div>
    <div class="wo-body">
      <p class="wo-ex" id="wo-ex"></p>
      <div class="wo-figure" id="wo-figure"></div>
      <p class="wo-phase" id="wo-phase"></p>
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring">
          <circle cx="60" cy="60" r="52" class="ring-bg"/>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="wo-ring"/>
        </svg>
        <div class="ring-num" id="wo-time"></div>
      </div>
      <p class="wo-count" id="wo-count"></p>
      <p class="wo-cue" id="wo-cue"></p>
    </div>
    <div class="wo-controls">
      <button class="btn ghost" id="wo-prev" data-i18n="wo_prev"></button>
      <button class="btn primary" id="wo-pause" data-i18n="wo_pause"></button>
      <button class="btn ghost" id="wo-next" data-i18n="wo_next"></button>
    </div>
  </section>

  <!-- 완료 화면 -->
  <section id="done" class="workout done-screen" hidden>
    <div class="wo-body">
      <div class="done-emoji">🎉</div>
      <h1 data-i18n="done_title">오늘 운동 완료!</h1>
      <p id="done-text" class="muted"></p>
      <button class="btn primary big" id="done-ok" data-i18n="done_ok"></button>
    </div>
  </section>

  <!-- 자세 설명 -->
  <dialog id="guide">
    <div class="guide-inner">
      <button class="icon-btn guide-close" id="guide-close" data-i18n-aria="close">✕</button>
      <div id="guide-body"></div>
    </div>
  </dialog>

  <script src="version.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
<div style="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#f5a524;color:#1a1300;font:700 13px/1.4 system-ui,sans-serif;text-align:center;padding:6px 10px;pointer-events:none">미리보기 · ccr-e807c3fb-g8xua6 · 실제 사이트가 아니에요</div>
</body>
</html>
